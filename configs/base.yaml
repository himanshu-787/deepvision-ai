run_name: unnamed_run
seed: 42
strategy: scratch            # scratch | head_only | finetune

data:
  batch_size: 128
  num_workers: 0
  image_size: 32
  stats: cifar               # cifar | imagenet
  augment: true

model:
  name: simple_cnn           # simple_cnn | improved_cnn | resnet18
  kwargs: {}

train:
  epochs: 15
  optimizer: adam            # sgd | adam | adamw
  lr: 0.001
  weight_decay: 0.0
  momentum: 0.9
  scheduler: none            # none | cosine | step
  amp: false
  grad_clip: null
  accum_steps: 1
  patience: null

finetune:                    # used only when strategy: finetune
  stages: [layer3, layer4]
  head_epochs: 3
  ft_epochs: 7
  head_lr: 0.001
  backbone_lr: 0.0001
  lr_decay: 0.5
  weight_decay: 0.0001

tracking:
  experiment_name: deepvision
  mlflow: true
  tensorboard: true
